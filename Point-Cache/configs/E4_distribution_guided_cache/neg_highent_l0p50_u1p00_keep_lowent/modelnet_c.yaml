# Configuration for 02_9_2 + high-entropy negative cache.
#
# Only the negative-cache entropy admission range differs from the original
# ModelNet-C config:
#   original: 0.2 < normalized entropy < 0.5
#   this run: 0.5 < normalized entropy < 1.0
#
# The original low-entropy replacement order inside the negative cache is kept
# by the runner code, so this tests "high-entropy admission, keep lower-entropy
# entries within that high-entropy band".

# --- Positive Cache Configuration ---
positive:
  enabled: True
  shot_capacity: 3
  alpha: 2.0
  beta: 3.0

# --- Negative Cache Configuration ---
negative:
  enabled: True
  shot_capacity: 2
  alpha: 0.117
  beta: 1.0
  entropy_threshold:
    lower: 0.5
    upper: 1.0
  mask_threshold:
    lower: 0.03
    upper: 1.0
